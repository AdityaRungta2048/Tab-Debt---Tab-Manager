  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5c95" />
      <stop offset="1" stop-color="#22406f" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <!-- one browser tab -->
  <path
    d="M1 30 c6 0 8.5-3.5 10-8 L13.5 13 c1.5-4.5 4.5-7 9-7 h27 c4.5 0 7.5 2.5 9 7 l2.5 9 c1.5 4.5 4 8 10 8 z"
    transform="translate(21 24) scale(0.62 0.86)"
    fill="#fff"
  />
  <rect x="19" y="47" width="90" height="58" rx="11" fill="#fff" />
  <!-- the Balance Bar, one rect per scoring factor -->
  <rect x="31" y="67" width="38" height="19" rx="6" fill="#2d4b7c" />
  <rect x="72" y="67" width="17" height="19" rx="6" fill="#5f82bb" />
