name: pages

# Publishes docs/ to GitHub Pages: the homepage and the privacy policy the Chrome Web Store
# listing links to.
#
# One-time setup: Settings → Pages → Build and deployment → Source: **GitHub Actions**.
# `enablement: true` below tries to do that automatically, but the workflow token is only
# allowed to create the Pages site when the repository grants it that permission; where it
# is not, the first run fails with "Create Pages site failed: Resource not accessible by
# integration" and the setting has to be flipped by hand. Every run after that is automatic.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-way: a partially published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
